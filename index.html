<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>TheRose - Avvento</title>
    </head>

    <body>
        <div class="sfondo"></div>

            <div class="header">
                <img src="therose-logo.svg" class="logo">
                <div class="titolo">The Rose Dance</div>
            </div>

            <div class="content" id="container">
                <template id="card-template">
                    <div class="card-container">
                        <div class="day-box">
                            <div class="card-front">
                                <img src="decor.png" class="decor">
                                <span class="card-number"></span>
                                <span class="card-month">Dicembre</span>
                                <img src="chain.png" class="chain" alt="locked">
                                <img src="elf.png" class="elf" alt="locked">
                            </div>
                            <div class="card-back"></div>
                        </div>
                    </div>
                </template>
            </div>
    </body>
    <script src="main.js"></script>
</html>
